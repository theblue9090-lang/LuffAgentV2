name: CI Build

on:
  push:
    branches: [claude/luff-agent-website-q6wzw6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (mirror Vercel)
        run: npm install
      - name: Build (mirror Vercel)
        run: npm run build
